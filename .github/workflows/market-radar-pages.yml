name: A-share market radar

on:
  push:
    branches: [feature/market-radar-pages]
    paths:
      - 'scripts/market_snapshot.py'
      - 'docs/index.html'
      - '.github/workflows/market-radar-pages.yml'
  schedule:
    # Beijing time 09:05-15:35, every 30 minutes on weekdays.
    # Scheduled workflows run from the default branch after this feature is merged.
    - cron: '5,35 1-7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-radar-pages
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Collect market snapshot
        run: python scripts/market_snapshot.py

      - name: Persist latest feed to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/data/latest.json docs/data/history.json docs/data/analysis-input.md
          if git diff --cached --quiet; then
            echo "No feed changes"
          else
            git commit -m "data: refresh A-share market radar"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
